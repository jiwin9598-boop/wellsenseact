app = 'wellsense'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  COOKIE_SECURE = 'true'
  TRUST_PROXY = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '10s'
  interval = '30s'
  method = 'GET'
  timeout = '5s'
  path = '/healthz'

[mounts]
  source = 'wellsense_data'
  destination = '/data'
